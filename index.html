<!DOCTYPE html>
<html>
<head>
  <title>Test Race</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 400px; width: 100%; margin-bottom:10px; }
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
  </style>
</head>
<body>
<h1>Race Test</h1>
<div id="map"></div>

<button id="startBtn" disabled>Start Race</button>
<div>Time elapsed: <span id="timer">--:--</span></div>

<h2>Leaderboard</h2>
<input id="name" placeholder="Your Name">
<button onclick="finishRace()">Finish Race</button>
<p>Last updated: <span id="last-commit">Loading...</span></p>

<table id="leaderboard">
<tr><th>Rank</th><th>Name</th><th>Time (seconds)</th></tr>
</table>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const startLocation = {lat: 16.8171, lng: 95.6164}; // Kyaiklat
const endLocation = {lat: 16.8812, lng: 95.6121};   // Maubin
const map = L.map('map').setView([startLocation.lat, startLocation.lng], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

L.polyline([ 
  [startLocation.lat, startLocation.lng], 
  [endLocation.lat, endLocation.lng] 
], {color:'red'}).addTo(map);

L.polyline([ [startLocation.lat,startLocation.lng], [endLocation.lat,endLocation.lng] ], {color:'red'}).addTo(map);

let raceStarted = false;
let startTime, timerInterval;
let results = JSON.parse(localStorage.getItem('raceResults')) || [];

function renderLeaderboard() {
  const table = document.getElementById('leaderboard');
  table.innerHTML = '<tr><th>Rank</th><th>Name</th><th>Time (seconds)</th></tr>';
  results.sort((a,b)=>a.time-b.time).forEach((r,i)=>{
    const row = table.insertRow();
    row.insertCell(0).innerText = i+1;
    row.insertCell(1).innerText = r.name;
    row.insertCell(2).innerText = r.time;
  });
}

renderLeaderboard();

const urlParams = new URLSearchParams(window.location.search);
const testMode = urlParams.get('test') === 'true';

if(testMode){
  // Simulate being at start location
  document.getElementById('startBtn').disabled = false;
} else {
  // Real geolocation check
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const distance = Math.sqrt((lat-startLocation.lat)**2 + (lng-startLocation.lng)**2)*111000; 
    if(distance < 50) document.getElementById('startBtn').disabled = false;
  });
}

document.getElementById('startBtn').onclick = ()=>{
  raceStarted = true;
  startTime = Date.now();
  document.getElementById('startBtn').disabled = true;
  timerInterval = setInterval(()=>{
    const elapsed = Math.floor((Date.now()-startTime)/1000);
    document.getElementById('timer').innerText = elapsed + " s";
  },1000);
};

function finishRace(){
  if(!raceStarted) return alert("Start race first!");
  clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now()-startTime)/1000);
  const name = document.getElementById('name').value;
  if(!name) return alert("Enter name!");
  results.push({name, time:elapsed});
  localStorage.setItem('raceResults', JSON.stringify(results));
  renderLeaderboard();
  raceStarted = false;
  document.getElementById('timer').innerText = "--:--";
  document.getElementById('name').value = "";
}
  <script>
const repoOwner = 'YOUR_USERNAME'; // replace with your GitHub username
const repoName = 'YOUR_REPO_NAME'; // replace with your repo name

fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/commits?per_page=1`)
  .then(response => response.json())
  .then(data => {
    if(data && data[0] && data[0].commit) {
      const date = new Date(data[0].commit.committer.date);
      document.getElementById('last-commit').innerText = date.toLocaleString();
    } else {
      document.getElementById('last-commit').innerText = 'Unknown';
    }
  })
  .catch(err => {
    console.error(err);
    document.getElementById('last-commit').innerText = 'Error fetching';
  });
</script>

</script>
</body>
</html>
